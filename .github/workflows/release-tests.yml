name: Release tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_gateway/package-lock.json

      - name: Install Gateway dependencies
        working-directory: web_gateway
        run: npm ci

      - name: Run Gateway unit tests
        working-directory: web_gateway
        run: npm test

      - name: Build images and run C++ tests
        run: docker compose build server gateway

      - name: Start release candidate
        run: docker compose up -d --no-build --wait --wait-timeout 60

      - name: Run HTTP and WebSocket smoke test
        working-directory: web_gateway
        run: npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop test services
        if: always()
        run: docker compose down -v
